<style>

    /* Tactile 3D Extrusion Classes */
    .btn-3d-primary {

    .btn-3d-primary:active {

    }

    .tile-3d-selected {

      border: 2px solid #84D8FF;
      border-bottom: 4px solid #53C3F8;
      transition: transform 0.08s ease-in-out;

    .tile-3d-selected:active {

    }

    /* Directional Speech Bubble Pointer (Tail) */
    .bubble-tail {
      position: absolute;
      left: -9px;
      top: 24px;
      width: 0;
      height: 0;
      border-top: 9px solid transparent;
      border-bottom: 9px solid transparent;
      border-right: 10px solid #E5E5E5;

    .bubble-tail::after {
      content: "";
      position: absolute;
      left: 2px;
      top: -7px;

<script>
    // Lightweight tactile click handler for tile selection interactivity
    document.querySelectorAll('[role="radio"]').forEach((tile) => {
      tile.addEventListener('click', () => {
        document.querySelectorAll('[role="radio"]').forEach(t => {
          t.setAttribute('aria-checked', 'false');
          t.className = 'tile-3d-neutral bg-surface-container-lowest rounded-2xl p-3.5 flex items-center justify-between cursor-pointer group';
          const badge = t.querySelector('.w-8');
          if (badge) {
            badge.className = 'w-8 h-8 rounded-full border-2 border-surface-variant bg-surface-container flex items-center justify-center text-on-surface-variant font-button-text text-button-text font-bold text-sm';
          }
          const textSpan = t.querySelector('span.text-body-lg');
          if (textSpan) {
            textSpan.className = 'text-body-lg font-body-lg text-on-surface';
          }
          const iconContainer = t.querySelector('.w-6, .w-7');
          if (iconContainer) {
            iconContainer.className = 'w-6 h-6 rounded-full border-2 border-surface-variant flex items-center justify-center';
            iconContainer.innerHTML = '';
          }
        });

        // Activate clicked tile
        tile.setAttribute('aria-checked', 'true');
        tile.className = 'tile-3d-selected rounded-2xl p-3.5 flex items-center justify-between cursor-pointer';
        const badge = tile.querySelector('.w-8');
        if (badge) {
          badge.className = 'w-8 h-8 rounded-full bg-[#1CB0F6] text-white flex items-center justify-center font-button-text text-button-text font-extrabold text-sm shadow-sm';
        }
        const textSpan = tile.querySelector('span.text-body-lg');
        if (textSpan) {
          textSpan.className = 'text-body-lg font-body-lg text-[#1CB0F6] font-extrabold';
        }
        const iconContainer = tile.querySelector('.w-6, .w-7');
        if (iconContainer) {
          iconContainer.className = 'w-7 h-7 rounded-full bg-[#1CB0F6] flex items-center justify-center text-white shadow-sm';
          iconContainer.innerHTML = '<span class="material-symbols-outlined text-base" style="font-variation-settings: \'wght\' 700;">check</span>';
        }
      });
    });
  </script>
